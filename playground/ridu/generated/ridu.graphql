type Query {
  Post(draft: Boolean, id: ID!, trash: Boolean): Post
  Posts(draft: Boolean, limit: Int, page: Int, sort: [String!], trash: Boolean, where: PostWhere): PostsPage!
  User(draft: Boolean, id: ID!, trash: Boolean): User
  Users(draft: Boolean, limit: Int, page: Int, sort: [String!], trash: Boolean, where: UserWhere): UsersPage!
  countPosts(draft: Boolean, trash: Boolean, where: PostWhere): PostCount!
  countUsers(draft: Boolean, trash: Boolean, where: UserWhere): UserCount!
  docAccessPost(id: ID!): PostDocAccess
  docAccessUser(id: ID!): UserDocAccess
  initializedUser: Boolean!
  meUser: UserAuth
  preference(key: String!): JSON
}

type Mutation {
  createPost(data: PostCreateInput!): Post
  createUser(data: UserCreateInput!): User
  deletePost(id: ID!): Post
  deletePreference(key: String!): Boolean!
  deleteUser(id: ID!): User
  duplicatePost(data: PostUpdateInput, id: ID!): Post
  duplicateUser(data: UserUpdateInput, id: ID!): User
  loginUser(email: String!, password: String!): UserAuth
  logoutUser(token: String): Boolean!
  refreshTokenUser(token: String): UserAuth
  refreshUser(token: String): UserAuth
  resetPreferences: Boolean!
  setPreference(key: String!, value: JSON!): JSON
  unlockUser(email: String!): Boolean!
  updatePost(data: PostUpdateInput!, expectedRevision: Int, id: ID!): Post
  updateUser(data: UserUpdateInput!, expectedRevision: Int, id: ID!): User
}

"An arbitrary JSON value."
scalar JSON

type Post {
  _revision: Int
  _status: String
  author: User
  content: JSON
  createdAt: String!
  id: ID!
  status: PostStatusOption
  title: String
  updatedAt: String!
}

input PostAuthorWhere {
  contains: String
  equals: String
  exists: Boolean
  greater_than: String
  greater_than_equal: String
  in: [String!]
  less_than: String
  less_than_equal: String
  like: String
  not_equals: String
  not_in: [String!]
}

type PostCount {
  totalDocs: Int!
}

input PostCreateInput {
  author: ID
  content: JSON
  status: PostCreateInputStatusOption
  title: String!
}

enum PostCreateInputStatusOption {
  "Draft"
  DRAFT
  "Published"
  PUBLISHED
}

type PostDocAccess {
  create: RiduPermission
  delete: RiduPermission
  duplicate: RiduPermission
  fields: PostDocAccessFields
  read: RiduPermission
  update: RiduPermission
}

type PostDocAccessFields {
  author: PostDocAccessFieldsAuthor
  content: PostDocAccessFieldsContent
  status: PostDocAccessFieldsStatus
  title: PostDocAccessFieldsTitle
}

type PostDocAccessFieldsAuthor {
  create: RiduPermission
  read: RiduPermission
  update: RiduPermission
}

type PostDocAccessFieldsContent {
  create: RiduPermission
  read: RiduPermission
  update: RiduPermission
}

type PostDocAccessFieldsStatus {
  create: RiduPermission
  read: RiduPermission
  update: RiduPermission
}

type PostDocAccessFieldsTitle {
