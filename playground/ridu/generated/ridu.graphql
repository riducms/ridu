input PostWhere {
  AND: [PostWhere!]
  NOT: PostWhere
  OR: [PostWhere!]
  and: [PostWhere!]
  author: PostAuthorWhere
  id: PostIDWhere
  not: PostWhere
  or: [PostWhere!]
  status: PostStatusWhere
