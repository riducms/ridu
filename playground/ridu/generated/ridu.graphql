  "Draft"
  DRAFT
  "Published"
  PUBLISHED
}

enum PostStatusOption {
  "Draft"
  DRAFT
  "Published"
  PUBLISHED
}

input PostStatusWhere {
  equals: PostRiduStatusOption
  exists: Boolean
  in: [PostRiduStatusOption!]
  not_equals: PostRiduStatusOption
  not_in: [PostRiduStatusOption!]
