services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ridu
      POSTGRES_PASSWORD: ridu
      POSTGRES_DB: ridu
    ports:
      - "54339:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridu -d ridu"]
      interval: 2s
      timeout: 2s
      retries: 15
