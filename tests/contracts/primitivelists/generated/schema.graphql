type Query {
  PrimitiveProduct(disableFallback: Boolean, draft: Boolean, fallbackLocale: [RiduLocale!], id: ID!, locale: RiduLocale, trash: Boolean): PrimitiveProduct
  PrimitiveProducts(disableFallback: Boolean, draft: Boolean, fallbackLocale: [RiduLocale!], limit: Int, locale: RiduLocale, page: Int, sort: [String!], trash: Boolean, where: PrimitiveProductWhere): PrimitiveProductsPage!
  countPrimitiveProducts(disableFallback: Boolean, draft: Boolean, fallbackLocale: [RiduLocale!], locale: RiduLocale, trash: Boolean, where: PrimitiveProductWhere): PrimitiveProductCount!
  docAccessPrimitiveProduct(id: ID!): PrimitiveProductDocAccess
  versionPrimitiveProduct(disableFallback: Boolean, draft: Boolean, fallbackLocale: [RiduLocale!], id: ID!, locale: RiduLocale, revision: Int!, trash: Boolean): PrimitiveProductVersion
  versionsPrimitiveProducts(disableFallback: Boolean, draft: Boolean, fallbackLocale: [RiduLocale!], id: ID!, limit: Int, locale: RiduLocale, page: Int, trash: Boolean): PrimitiveProductsVersionsPage!
}

type Mutation {
  createPrimitiveProduct(data: PrimitiveProductCreateInput!, disableFallback: Boolean, draft: Boolean, fallbackLocale: [RiduLocale!], locale: RiduLocale): PrimitiveProduct
  deletePrimitiveProduct(disableFallback: Boolean, fallbackLocale: [RiduLocale!], id: ID!, locale: RiduLocale): PrimitiveProduct
  duplicatePrimitiveProduct(data: PrimitiveProductUpdateInput, disableFallback: Boolean, fallbackLocale: [RiduLocale!], id: ID!, locale: RiduLocale): PrimitiveProduct
  restoreVersionPrimitiveProduct(disableFallback: Boolean, draft: Boolean, expectedRevision: Int, fallbackLocale: [RiduLocale!], id: ID!, locale: RiduLocale, revision: Int!): PrimitiveProduct
  updatePrimitiveProduct(data: PrimitiveProductUpdateInput!, disableFallback: Boolean, expectedRevision: Int, fallbackLocale: [RiduLocale!], id: ID!, locale: RiduLocale): PrimitiveProduct
}

